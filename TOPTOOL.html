var _db     = firebase.firestore();
var _store  = firebase.storage();
var _auth   = firebase.auth();
var _fbUser = null;
var _userName = '';

// Autenticación anónima + solicitar nombre
function _initAuth(callback) {
    // Recuperar nombre guardado
    var savedName = '';
    try { savedName = localStorage.getItem('toptool_username') || ''; } catch(e) {}

    if (savedName) {
        _userName = savedName;
        _auth.signInAnonymously().then(function(cred) {
            _fbUser = cred.user;
            document.getElementById('login-overlay').style.display = 'none';
            callback();
        });
        return;
    }
    // Mostrar pantalla de login
    document.getElementById('login-overlay').style.display = 'flex';
    document.getElementById('btn-login').onclick = function() {
        var nombre = document.getElementById('input-login-nombre').value.trim();
        if (!nombre) { alert('Ingresa tu nombre para continuar.'); return; }
        _userName = nombre;
        try { localStorage.setItem('toptool_username', nombre); } catch(e) {}
        _auth.signInAnonymously().then(function(cred) {
            _fbUser = cred.user;
            document.getElementById('login-overlay').style.display = 'none';
            callback();
        }).catch(function(err) {
            alert('Error de conexión: ' + err.message);
        });
    };
    document.getElementById('input-login-nombre').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
}

function aplicarFiltros() {
    var txt = document.getElementById('filter-texto').value.trim().toLowerCase();
    var cs  = document.getElementById('filter-ciudad').value.trim();
    var count = 0;

    _fMarkers.forEach(function(mk) {
        var d = mk._fd;
        var ok = true;
        if (txt && d.nombre.toLowerCase().indexOf(txt) === -1) ok = false;
        if (cs  && d.ciudad !== cs) ok = false;
        if (ok) { mk.addTo(map_88e2ef504ce0ca54404bcfe0b9cd0d76); count++; }
        else    { mk.remove(); }
    });

    if (count === 1) {
        var found = _fMarkers.find(function(mk) {
            var d = mk._fd;
            if (txt && d.nombre.toLowerCase().indexOf(txt) === -1) return false;
            if (cs  && d.ciudad !== cs) return false;
            return true;
        });
        if (found) { map_88e2ef504ce0ca54404bcfe0b9cd0d76.setView(found.getLatLng(), 16); found.openPopup(); }
    }

    var r = document.getElementById('filter-result');
    r.textContent = 'Se encontraron ' + count + ' resultado(s)';
    r.style.display = 'block';
}

function limpiarFiltros() {
    document.getElementById('filter-texto').value = '';
    document.getElementById('filter-ciudad').value = '';
    document.getElementById('filter-result').style.display = 'none';
    _fMarkers.forEach(function(mk) { mk.addTo(map_88e2ef504ce0ca54404bcfe0b9cd0d76); });
}

function toggleFerrePanel() {
    var body  = document.getElementById('ferre-body');
    var arrow = document.getElementById('ferre-arrow');
    if (body.style.display === 'none') {
        body.style.display  = 'block';
        arrow.style.transform = 'rotate(180deg)';
    } else {
        body.style.display  = 'none';
        arrow.style.transform = 'rotate(0deg)';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('filter-texto');
    if (input) input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') aplicarFiltros();
    });
    map_88e2ef504ce0ca54404bcfe0b9cd0d76.on('click', _onMapClick);
});

// NOTAS DE VOZ — Firebase Storage + MediaRecorder
// ════════════════════════════════════════════
var _mediaRecorder = null;
var _audioChunks   = [];
var _grabandoId    = null;
var _timerInterval = null;
var _timerSeg      = 0;
var MAX_SEG        = 60;

function _guardarAudio(id, blob) {
    var ferre  = _fData.find(function(d) { return d.id === id; });
    var nombre = ferre ? ferre.nombre : String(id);
    var safe   = nombre.replace(/[^a-zA-Z0-9_\-]/g, '_').substring(0, 30);
    var path   = 'audios/' + id + '_' + safe + '.webm';
    var ref    = _store.ref(path);
    var playerDiv = document.getElementById('audio-player-' + id);
    if (playerDiv) playerDiv.innerHTML = '<span style="font-size:11px;color:#888;">Subiendo audio...</span>';
    ref.put(blob, {contentType: 'audio/webm'}).then(function() {
        return ref.getDownloadURL();
    }).then(function(url) {
        // Guardar URL en Firestore
        _db.collection('audios').doc(String(id)).set({
            url:     url,
            path:    path,
            usuario: _userName,
            uid:     _fbUser ? _fbUser.uid : '',
            fecha:   new Date().toISOString()
        });
        _mostrarPlayerUrl(id, url);
    }).catch(function(err) {
        if (playerDiv) playerDiv.innerHTML = '<span style="font-size:11px;color:red;">Error al subir audio</span>';
    });
}

function _borrarAudio(id) {
    _db.collection('audios').doc(String(id)).get().then(function(doc) {
        if (doc.exists && doc.data().path) {
            _store.ref(doc.data().path).delete().catch(function(){});
        }
        _db.collection('audios').doc(String(id)).delete();
    });
}

function _cargarAudioPlayer(id) {
    var playerDiv = document.getElementById('audio-player-' + id);
    if (!playerDiv) return;
    _db.collection('audios').doc(String(id)).get().then(function(doc) {
        if (doc.exists && doc.data().url) {
            _mostrarPlayerUrl(id, doc.data().url);
        }
    });
}

function _mostrarPlayerUrl(id, url) {
    var playerDiv = document.getElementById('audio-player-' + id);
    if (!playerDiv) return;
    playerDiv.innerHTML =
        '<div style="display:flex;align-items:center;gap:6px;background:#f5f5f5;border-radius:6px;padding:6px;">' +
        '<audio controls src="' + url + '" style="flex:1;height:32px;"></audio>' +
        '<button onclick="_eliminarAudio(' + id + ')" style="background:#f44336;color:white;border:none;border-radius:3px;padding:3px 7px;cursor:pointer;font-size:11px;" title="Eliminar audio">&#128465;</button>' +
        '</div>';
}

function _eliminarAudio(id) {
    if (!confirm('¿Eliminar la nota de voz?')) return;
    _borrarAudio(id);
    var playerDiv = document.getElementById('audio-player-' + id);
    if (playerDiv) playerDiv.innerHTML = '';
}

function iniciarGrabacion(id) {
    if (_grabandoId !== null) {
        alert('Ya hay una grabación en curso.');
        return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Tu navegador no soporta grabación de audio.');
        return;
    }
    navigator.mediaDevices.getUserMedia({audio: true})
        .then(function(stream) {
            _grabandoId  = id;
            _audioChunks = [];
            _timerSeg    = 0;

            _mediaRecorder = new MediaRecorder(stream);
            _mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) _audioChunks.push(e.data);
            };
            _mediaRecorder.onstop = function() {
                var blob = new Blob(_audioChunks, {type: 'audio/webm;codecs=opus'});
                _guardarAudio(id, blob);
                // Detener tracks del micrófono
                stream.getTracks().forEach(function(t) { t.stop(); });
                // Resetear UI
                var btnG = document.getElementById('btn-grabar-' + id);
                var btnD = document.getElementById('btn-detener-' + id);
                var tmr  = document.getElementById('timer-' + id);
                if (btnG) btnG.style.display = 'inline-block';
                if (btnD) btnD.style.display = 'none';
                if (tmr)  tmr.textContent    = '';
                clearInterval(_timerInterval);
                _grabandoId = null;
            };

            _mediaRecorder.start(100);

            // Actualizar UI
            var btnG = document.getElementById('btn-grabar-' + id);
            var btnD = document.getElementById('btn-detener-' + id);
            if (btnG) btnG.style.display = 'none';
            if (btnD) btnD.style.display = 'inline-block';

            // Timer
            _timerInterval = setInterval(function() {
                _timerSeg++;
                var tmr = document.getElementById('timer-' + id);
                if (tmr) tmr.textContent = _timerSeg + 's / ' + MAX_SEG + 's';
                if (_timerSeg >= MAX_SEG) detenerGrabacion(id);
            }, 1000);
        })
        .catch(function(err) {
            alert('No se pudo acceder al micrófono: ' + err.message);
        });
}

function detenerGrabacion(id) {
    if (_mediaRecorder && _mediaRecorder.state !== 'inactive') {
        _mediaRecorder.stop();
    }
    clearInterval(_timerInterval);
}

var _notasCache = {};  // cache local para mostrar rápido

function _cargarTodasLasNotas() {
    _db.collection('notas').onSnapshot(function(snap) {
        snap.forEach(function(doc) {
            _notasCache[doc.id] = doc.data();
        });
        // Actualizar textareas abiertos
        Object.keys(_notasCache).forEach(function(ferreId) {
            var ta = document.getElementById('nota-' + ferreId);
            if (ta) ta.value = _notasCache[ferreId].texto || '';
        });
    });
}

function _getNota(id) {
    return (_notasCache[String(id)] && _notasCache[String(id)].texto) || '';
}

function guardarNota(id) {
    var ta = document.getElementById('nota-' + id);
    if (!ta) return;

function _nombreAudio(id, nombre, fecha) {
    // Sanitizar nombre: quitar caracteres no válidos en nombres de archivo
    var safe = nombre
        .replace(/[\/:*?"<>|]/g, '')
        .replace(/\s+/g, '_')
        .substring(0, 40)
        .trim();
    return fecha + '_' + safe + '.webm';
}

function descargarNotas() {
    var hoy   = new Date();
    var fecha = hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0') + '-' + String(hoy.getDate()).padStart(2,'0');

    // Recopilar datos de texto
    var notasData = [];
    for (var i = 0; i < _fData.length; i++) {
        var d    = _fData[i];
        var nota = _getNota(d.id);
        if (nota.trim()) {
            notasData.push({id: d.id, nombre: d.nombre, ciudad: d.ciudad || '', direccion: d.direccion || '', nota: nota});
        }
    }

    // Recopilar IDs con audio desde Firestore
    _db.collection('audios').get().then(function(snap) {
        var audioData = {};
        snap.forEach(function(doc) { audioData[doc.id] = doc.data(); });
        var audioIds = Object.keys(audioData);

        // Unir ferreterías que tienen nota O audio
        var todasIds = {};
        notasData.forEach(function(n) { todasIds[String(n.id)] = true; });
        audioIds.forEach(function(id) { todasIds[id] = true; });

        if (Object.keys(todasIds).length === 0) {
            alert('No hay notas ni audios guardados todavia.');
            return;
        }

        // Construir filas del Excel
        var excelRows = [];
        _fData.forEach(function(d) {
            if (!todasIds[String(d.id)]) return;
            var tieneAudio = !!audioData[String(d.id)];
            excelRows.push({
                'Ferreteria':  d.nombre,
                'Ciudad':      d.ciudad    || '',
                'Direccion':   d.direccion || '',
                'Nota':        _getNota(d.id),
                'Usuario':     (_notasCache[String(d.id)] && _notasCache[String(d.id)].usuario) || '',
                'Audio':       tieneAudio ? _nombreAudio(d.id, d.nombre, fecha) : ''
            });
        });

        // Generar Excel
        var ws = XLSX.utils.json_to_sheet(excelRows);
        ws['!cols'] = [{wch:35},{wch:20},{wch:35},{wch:50},{wch:20},{wch:30}];
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Notas');
        var excelBuf = XLSX.write(wb, {bookType:'xlsx', type:'array'});

        // Si no hay audios → solo Excel
        if (audioIds.length === 0) {
            var blob = new Blob([excelBuf], {type:'application/octet-stream'});
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'notas_ferreterias_' + fecha + '.xlsx';
            a.click();
            URL.revokeObjectURL(a.href);
            return;
        }

        // Hay audios → generar ZIP descargando desde Storage
        var zip     = new JSZip();
        var carpeta = zip.folder('notas_ferreterias_' + fecha);
        carpeta.file('notas_ferreterias_' + fecha + '.xlsx', excelBuf);

        var pendientes = audioIds.length;
        audioIds.forEach(function(id) {
            var url = audioData[id].url;
            var fd  = _fData.find(function(x){ return String(x.id) === id; });
            var nm  = _nombreAudio(id, fd ? fd.nombre : id, fecha);
            fetch(url).then(function(r) { return r.blob(); }).then(function(blob) {
                carpeta.file(nm, blob);
                pendientes--;
                if (pendientes === 0) {
                    zip.generateAsync({type:'blob'}).then(function(zipBlob) {
                        var a = document.createElement('a');
                        a.href = URL.createObjectURL(zipBlob);
                        a.download = 'notas_ferreterias_' + fecha + '.zip';
                        a.click();
                        URL.revokeObjectURL(a.href);
                    });
                }
            }).catch(function() {
                pendientes--;
                if (pendientes === 0) {
                    zip.generateAsync({type:'blob'}).then(function(zipBlob) {
                        var a = document.createElement('a');
                        a.href = URL.createObjectURL(zipBlob);
                        a.download = 'notas_ferreterias_' + fecha + '.zip';
                        a.click();
                        URL.revokeObjectURL(a.href);
                    });
                }
            });
        });
    }).catch(function() {
        alert('Error al leer los audios. Intenta de nuevo.');
    });
}

var _dragSrcIdx = null;

function _renderRutaPanel() {
    var lista = document.getElementById('ruta-lista');
    var contador = document.getElementById('ruta-contador');
    if (!lista) return;
    contador.textContent = _rutaPuntos.length + ' punto' + (_rutaPuntos.length !== 1 ? 's' : '');
    if (_rutaPuntos.length === 0) {
        lista.innerHTML = '<p style="color:#999;font-size:12px;text-align:center;margin:10px 0;">Haz clic en un marcador y presiona<br><b>&#10133; Agregar a ruta</b></p>';
        return;
    }
    lista.innerHTML = '';
    for (var i = 0; i < _rutaPuntos.length; i++) {
        var p = _rutaPuntos[i];
        var item = document.createElement('div');
        item.setAttribute('draggable', 'true');
        item.dataset.idx = i;
        item.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:6px;background:#f9f9f9;border-radius:6px;padding:6px;border-left:3px solid ' + p.color + ';cursor:grab;transition:opacity 0.2s;';
        item.innerHTML =
            '<span style="color:#aaa;font-size:14px;padding:0 2px;cursor:grab;">&#8942;&#8942;</span>' +
            '<span style="background:' + p.color + ';color:white;border-radius:50%;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;">' + (i+1) + '</span>' +
            '<span style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + p.nombre + '">' + p.nombre + '</span>' +
            '<button onclick="removerDeRuta(' + i + ')" style="background:#f44336;color:white;border:none;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:11px;">&#10005;</button>';

        // Drag events
        item.addEventListener('dragstart', function(e) {
            _dragSrcIdx = parseInt(this.dataset.idx);
            this.style.opacity = '0.4';
            e.dataTransfer.effectAllowed = 'move';
        });
        item.addEventListener('dragend', function() {
            this.style.opacity = '1';
            // Remove drag-over highlights
            var items = document.querySelectorAll('#ruta-lista > div');
            items.forEach(function(el) { el.style.borderTop = ''; el.style.borderBottom = ''; });
        });
        item.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            var items = document.querySelectorAll('#ruta-lista > div');
            items.forEach(function(el) { el.style.borderTop = ''; el.style.borderBottom = ''; });
            var targetIdx = parseInt(this.dataset.idx);
            if (targetIdx !== _dragSrcIdx) {
                if (targetIdx > _dragSrcIdx) {
                    this.style.borderBottom = '2px solid #2196F3';
                } else {
                    this.style.borderTop = '2px solid #2196F3';
                }
            }
        });
        item.addEventListener('drop', function(e) {
            e.preventDefault();
            var toIdx = parseInt(this.dataset.idx);
            if (_dragSrcIdx === null || _dragSrcIdx === toIdx) return;
            var moved = _rutaPuntos.splice(_dragSrcIdx, 1)[0];
            _rutaPuntos.splice(toIdx, 0, moved);
            _dragSrcIdx = null;
            _renderRutaPanel();
            if (_rutaPuntos.length >= 2) trazarRuta();
        });

        lista.appendChild(item);
    }
}

function _formatDur(min) {
    return min >= 60
        ? Math.floor(min/60) + ' h ' + (min % 60) + ' min'
        : min + ' min';
}

function trazarRuta() {
    if (_rutaPuntos.length < 2) return;
    var statusEl = document.getElementById('ruta-status');
    if (statusEl) statusEl.textContent = 'Calculando ruta...';

    if (_modoRuta === 'foot') {
        // ── A PIE: OpenRouteService foot-walking ──
        var coords = _rutaPuntos.map(function(p) { return [p.lon, p.lat]; });
        var orsUrl = 'https://api.openrouteservice.org/v2/directions/foot-walking/geojson';
        fetch(orsUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': _ORS_KEY
            },
            body: JSON.stringify({ coordinates: coords })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.features || !data.features.length) {
                if (statusEl) statusEl.textContent = 'No se pudo calcular la ruta a pie.';
                return;
            }
            if (_rutaPolyline) map_88e2ef504ce0ca54404bcfe0b9cd0d76.removeLayer(_rutaPolyline);
            var lls = data.features[0].geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
            _rutaPolyline = L.polyline(lls, {color:'#4CAF50', weight:5, opacity:0.85, dashArray:'8,10'}).addTo(map_88e2ef504ce0ca54404bcfe0b9cd0d76);
            map_88e2ef504ce0ca54404bcfe0b9cd0d76.fitBounds(_rutaPolyline.getBounds(), {padding:[30,30]});
            var seg    = data.features[0].properties.segments[0];
            var distKm = (seg.distance / 1000).toFixed(1);
            var dur    = Math.round(seg.duration / 60);
            if (statusEl) statusEl.textContent = distKm + ' km - aprox. ' + _formatDur(dur) + ' caminando';
        })
        .catch(function() {
            if (statusEl) statusEl.textContent = 'Error al calcular ruta a pie.';
        });

    } else {
        // ── EN AUTO: OSRM driving ──
        var coords = _rutaPuntos.map(function(p) { return p.lon + ',' + p.lat; }).join(';');
        var url    = 'https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson';
        fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.routes || !data.routes.length) {
                if (statusEl) statusEl.textContent = 'No se pudo calcular la ruta en auto.';
                return;
            }
            if (_rutaPolyline) map_88e2ef504ce0ca54404bcfe0b9cd0d76.removeLayer(_rutaPolyline);
            var lls    = data.routes[0].geometry.coordinates.map(function(c) { return [c[1], c[0]]; });
            _rutaPolyline = L.polyline(lls, {color:'#2196F3', weight:5, opacity:0.85}).addTo(map_88e2ef504ce0ca54404bcfe0b9cd0d76);
            map_88e2ef504ce0ca54404bcfe0b9cd0d76.fitBounds(_rutaPolyline.getBounds(), {padding:[30,30]});
            var distKm = (data.routes[0].distance / 1000).toFixed(1);
            var dur    = Math.round(data.routes[0].duration / 60);
            if (statusEl) statusEl.textContent = distKm + ' km - aprox. ' + _formatDur(dur) + ' en auto';
        })
        .catch(function() {
            if (statusEl) statusEl.textContent = 'Error de conexion con OSRM.';
        });
    }
}

var _gpsMarker = null;
var _gpsCircle = null;

function estoyAqui() {
    if (!navigator.geolocation) {
        alert('Tu navegador no soporta geolocalización.');
        return;
    }
    var btn = document.getElementById('btn-gps');
    if (btn) { btn.textContent = '...'; btn.disabled = true; }

    navigator.geolocation.getCurrentPosition(
        function(pos) {
            var lat = pos.coords.latitude;
            var lon = pos.coords.longitude;
            var acc = pos.coords.accuracy;

            // Remover marcador anterior
            if (_gpsMarker) { map_88e2ef504ce0ca54404bcfe0b9cd0d76.removeLayer(_gpsMarker); _gpsMarker = null; }
            if (_gpsCircle) { map_88e2ef504ce0ca54404bcfe0b9cd0d76.removeLayer(_gpsCircle); _gpsCircle = null; }

            // Círculo de precisión
            _gpsCircle = L.circle([lat, lon], {
                radius: acc,
                color: '#2196F3',
                fillColor: '#2196F3',
                fillOpacity: 0.15,
                weight: 1
            }).addTo(map_88e2ef504ce0ca54404bcfe0b9cd0d76);

            // Marcador azul pulsante
            var gpsSvg = encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">' +
                '<circle cx="12" cy="12" r="10" fill="#2196F3" stroke="white" stroke-width="2"/>' +
                '<circle cx="12" cy="12" r="4" fill="white"/>' +
                '</svg>'
            );
            _gpsMarker = L.marker([lat, lon], {
                icon: L.icon({
                    iconUrl: 'data:image/svg+xml,' + gpsSvg,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12],
                    popupAnchor: [0, -14]
                }),
                zIndexOffset: 1000
            }).addTo(map_88e2ef504ce0ca54404bcfe0b9cd0d76);
            _gpsMarker.bindPopup('<b>Tu ubicación</b><br><small>Precisión: ~' + Math.round(acc) + ' m</small>').openPopup();

            map_88e2ef504ce0ca54404bcfe0b9cd0d76.setView([lat, lon], 15);

            if (btn) { btn.innerHTML = '&#128205;'; btn.disabled = false; }
        },
        function(err) {
            alert('No se pudo obtener la ubicación: ' + err.message);
            if (btn) { btn.innerHTML = '&#128205;'; btn.disabled = false; }
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

    _mkTemporal = L.marker([lat, lon], {icon: _createIcon(COLOR_MANUAL)}).addTo(map_88e2ef504ce0ca54404bcfe0b9cd0d76);
    _mkTemporal.bindTooltip('Nuevo punto').openTooltip();
    // Mostrar formulario
    var form = document.getElementById('form-nuevo-punto');
    document.getElementById('input-nuevo-nombre').value = '';
    document.getElementById('nuevo-lat').value  = lat.toFixed(6);
    document.getElementById('nuevo-lon').value  = lon.toFixed(6);
    form.style.display = 'block';
    document.getElementById('input-nuevo-nombre').focus();
}

function confirmarNuevoPunto() {
    var nombre = document.getElementById('input-nuevo-nombre').value.trim();
    if (!nombre) { alert('Ingresa un nombre para el punto.'); return; }
    var lat = parseFloat(document.getElementById('nuevo-lat').value);
    var lon = parseFloat(document.getElementById('nuevo-lon').value);
    _db.collection('puntos_manual').add({
        nombre:  nombre,
        lat:     lat,
        lon:     lon,
        usuario: _userName,
        uid:     _fbUser ? _fbUser.uid : '',
        fecha:   new Date().toISOString()
    });
    if (_mkTemporal) { map_88e2ef504ce0ca54404bcfe0b9cd0d76.removeLayer(_mkTemporal); _mkTemporal = null; }
    document.getElementById('form-nuevo-punto').style.display = 'none';
    activarModoMarcado();
}

function cancelarNuevoPunto() {
    if (_mkTemporal) { map_88e2ef504ce0ca54404bcfe0b9cd0d76.removeLayer(_mkTemporal); _mkTemporal = null; }
    document.getElementById('form-nuevo-punto').style.display = 'none';
}

</script>
